services:
  bot:
    build: .
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - botnet
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-southeast-1
        awslogs-group: bearbard-bot-logs
        awslogs-create-group: "true"
        awslogs-stream: bot

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - botnet
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-southeast-1
        awslogs-group: bearbard-postgres-logs
        awslogs-create-group: "true"
        awslogs-stream: postgres

networks:
  botnet:

volumes:
  pgdata:
