services:
  bot:
    build: .
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - botnet
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - botnet
    restart: unless-stopped

networks:
  botnet:

volumes:
  pgdata:
